name: midraw-ci

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android_sdk
      ANDROID_ABIS: "armeabi-v7a arm64-v8a x86 x86_64"
      ANDROID_APIS: "29 30 31 32 33 34 35 36"
      BUILD_TYPES: "Debug Release"
      SKIP_THIRD_PARTY: "1"
      SKIP_SYMBOLS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 openjdk-17-jdk cmake ninja-build e2fsprogs

      - name: Setup Android SDK
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_SDK_ROOT}/platform-tools" >> $GITHUB_PATH
          yes | "${SDKMANAGER}" --licenses >/dev/null
          "${SDKMANAGER}" "platform-tools"
          for api in ${ANDROID_APIS}; do
            "${SDKMANAGER}" "system-images;android-${api};google_apis;x86_64"
          done
          NDK_PKG=$("${SDKMANAGER}" --list | awk '/ndk;27/ {print $1}' | tail -1)
          if [[ -z "${NDK_PKG}" ]]; then
            echo "NDK 27.x not found in sdkmanager list" >&2
            exit 1
          fi
          "${SDKMANAGER}" "${NDK_PKG}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/${NDK_PKG/;/\/}" >> $GITHUB_ENV

      - name: Init third-party (optional)
        if: ${{ env.SKIP_THIRD_PARTY != '1' }}
        run: |
          set -e
          THIRD_PARTY_INSTALL="${GITHUB_WORKSPACE}/third_party_install"
          mkdir -p "${THIRD_PARTY_INSTALL}"
          for ABI in ${ANDROID_ABIS}; do
            for dir in "${GITHUB_WORKSPACE}/third_party/"*; do
              if [[ -f "${dir}/CMakeLists.txt" ]]; then
                name=$(basename "${dir}")
                BUILD_DIR="${dir}/build_${ABI}"
                INSTALL_DIR="${THIRD_PARTY_INSTALL}/${ABI}/${name}"
                cmake -S "${dir}" -B "${BUILD_DIR}" \
                  -DCMAKE_INSTALL_PREFIX="${INSTALL_DIR}" \
                  -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                  -DANDROID_ABI="${ABI}" -DANDROID_PLATFORM=android-21 \
                  -DCMAKE_BUILD_TYPE=Release
                cmake --build "${BUILD_DIR}" --target install
              fi
            done
          done
          echo "THIRD_PARTY_INSTALL=${THIRD_PARTY_INSTALL}" >> $GITHUB_ENV

      - name: Extract system libs
        if: ${{ env.SKIP_SYMBOLS != '1' }}
        run: |
          chmod +x "${GITHUB_WORKSPACE}/tools/extract_system_libs.sh"
          "${GITHUB_WORKSPACE}/tools/extract_system_libs.sh"

      - name: Generate symbol candidates
        if: ${{ env.SKIP_SYMBOLS != '1' }}
        run: |
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          python3 "${GITHUB_WORKSPACE}/tools/gen_symbol_candidates.py" \
            --syslib-root "${GITHUB_WORKSPACE}/generated/syslibs" \
            --apis ${ANDROID_APIS} \
            --nm "${NM}" \
            --required "${GITHUB_WORKSPACE}/tools/required_symbols.txt" \
            --out "${GITHUB_WORKSPACE}/generated/android_symbol_candidates.h"

      - name: Generate mangled symbol map
        if: ${{ env.SKIP_SYMBOLS != '1' }}
        run: |
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          python3 "${GITHUB_WORKSPACE}/tools/gen_symbols.py" \
            --root "${GITHUB_WORKSPACE}/generated/syslibs" \
            --root "${GITHUB_WORKSPACE}/extra_syslibs" \
            --nm "${NM}" \
            --out "${GITHUB_WORKSPACE}/generated/generated_symbols.h"

      - name: Build midraw (static/shared) and benchmark
        run: |
          for ABI in ${ANDROID_ABIS}; do
            for BUILD_TYPE in ${BUILD_TYPES}; do
              PREFIX_PATH=""
              if [[ -d "${THIRD_PARTY_INSTALL:-}" ]]; then
                for dir in "${THIRD_PARTY_INSTALL}/${ABI}/"*; do
                  if [[ -d "${dir}" ]]; then
                    PREFIX_PATH="${PREFIX_PATH};${dir}"
                  fi
                done
              fi
              BUILD_DIR="${GITHUB_WORKSPACE}/build_${ABI}_${BUILD_TYPE}"
              cmake -S "${GITHUB_WORKSPACE}" -B "${BUILD_DIR}" -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="${ABI}" -DANDROID_PLATFORM=android-28 \
                -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
                -DMIDRAW_BUILD_SHARED=ON \
                -DMIDRAW_BUILD_STATIC=ON \
                -DMIDRAW_BUILD_BENCHMARK=ON \
                -DMIDRAW_BUILD_OVERLAY=ON \
                -DMIDRAW_BUILD_DEMO=ON \
                -DCMAKE_PREFIX_PATH="${PREFIX_PATH}"
              cmake --build "${BUILD_DIR}"
            done
          done

      - name: Stage public API docs
        run: |
          for ABI in ${ANDROID_ABIS}; do
            for BUILD_TYPE in ${BUILD_TYPES}; do
              BUILD_DIR="${GITHUB_WORKSPACE}/build_${ABI}_${BUILD_TYPE}"
              API_DIR="${BUILD_DIR}/public_api/include"
              mkdir -p "${API_DIR}"
              cp "${GITHUB_WORKSPACE}/include/"*.h "${API_DIR}/" || true
              if [[ -f "${GITHUB_WORKSPACE}/docs/user_dock.md" ]]; then
                cp "${GITHUB_WORKSPACE}/docs/user_dock.md" "${BUILD_DIR}/public_api/user_dock.md"
              fi
            done
          done

      - name: Summarize build outputs
        run: |
          {
            echo "### Build outputs";
            for BUILD_TYPE in ${BUILD_TYPES}; do
              echo "";
              echo "#### ${BUILD_TYPE}";
              find "${GITHUB_WORKSPACE}" -maxdepth 2 -type f -path "${GITHUB_WORKSPACE}/build_*_${BUILD_TYPE}/*" \
                \( -name "libmidraw.so" -o -name "libmidraw.a" -o -name "benchmark" -o -name "overlay_engine" -o -name "draw_demo" \) \
                -print;
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midraw-build
          path: |
            build_*_Debug/libmidraw.so
            build_*_Debug/libmidraw.a
            build_*_Debug/benchmark
            build_*_Debug/overlay_engine
            build_*_Debug/draw_demo
            build_*_Debug/public_api/**
            build_*_Release/libmidraw.so
            build_*_Release/libmidraw.a
            build_*_Release/benchmark
            build_*_Release/overlay_engine
            build_*_Release/draw_demo
            build_*_Release/public_api/**
            generated/android_symbol_candidates.h
            docs/user_dock.md
            include/*.h
