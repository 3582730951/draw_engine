name: build

on:
  workflow_dispatch:
  push:
    paths:
      - "core/**"

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android_sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 openjdk-17-jdk cmake ninja-build

      - name: Setup Android SDK + NDK
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          echo "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools"
          NDK_PKG=$(sdkmanager --list | awk '/ndk;27/ {print $1}' | tail -1)
          if [[ -z "${NDK_PKG}" ]]; then
            echo "NDK 27.x not found in sdkmanager list" >&2
            exit 1
          fi
          sdkmanager "${NDK_PKG}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/${NDK_PKG/;/\/}" >> $GITHUB_ENV

      - name: Clone android libs dump
        run: |
          git clone --depth 1 https://github.com/example/android-lib-dump "${GITHUB_WORKSPACE}/core/android-lib-dump"

      - name: Generate compatibility header
        run: |
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          python3 "${GITHUB_WORKSPACE}/core/scripts/gen_symbols.py" \
            --root "${GITHUB_WORKSPACE}/core/android-lib-dump" \
            --out "${GITHUB_WORKSPACE}/core/include/generated_symbols.h" \
            --nm "${NM}"

      - name: Build (CMake + NDK)
        run: |
          cmake -S "${GITHUB_WORKSPACE}/core" -B "${GITHUB_WORKSPACE}/core/build" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "${GITHUB_WORKSPACE}/core/build"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            core/build/overlay_engine
            core/include/generated_symbols.h
