name: build

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  android-build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android_sdk
      ANDROID_LIB_DUMP_REPO: https://github.com/example/android-lib-dump
      ANDROID_ABIS: "armeabi-v7a arm64-v8a x86 x86_64"
      BUILD_TYPES: "Release Debug"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 openjdk-17-jdk cmake ninja-build

      - name: Setup Android SDK + NDK
        run: |
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          curl -L -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "${ANDROID_SDK_ROOT}/cmdline-tools"
          mv "${ANDROID_SDK_ROOT}/cmdline-tools/cmdline-tools" "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          yes | "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --licenses >/dev/null
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools"
          NDK_PKG=$("${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" --list | awk '/ndk;27/ {print $1}' | tail -1)
          if [[ -z "${NDK_PKG}" ]]; then
            echo "NDK 27.x not found in sdkmanager list" >&2
            exit 1
          fi
          "${SDKMANAGER}" --sdk_root="${ANDROID_SDK_ROOT}" "${NDK_PKG}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/${NDK_PKG/;/\/}" >> $GITHUB_ENV

      - name: Clone android libs dump
        run: |
          set +e
          git clone --depth 1 "${ANDROID_LIB_DUMP_REPO}" "${GITHUB_WORKSPACE}/android-lib-dump"
          if [[ $? -ne 0 ]]; then
            echo "ANDROID_LIB_DUMP_REPO clone failed, skip symbol generation" >&2
            echo "SKIP_SYMBOLS=1" >> $GITHUB_ENV
          fi

      - name: Generate compatibility header
        if: ${{ env.SKIP_SYMBOLS != '1' }}
        run: |
          NM="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          python3 "${GITHUB_WORKSPACE}/scripts/gen_symbols.py" \
            --root "${GITHUB_WORKSPACE}/android-lib-dump" \
            --out "${GITHUB_WORKSPACE}/include/generated_symbols.h" \
            --nm "${NM}"

      - name: Build (CMake + NDK)
        run: |
          for ABI in ${ANDROID_ABIS}; do
            for BUILD_TYPE in ${BUILD_TYPES}; do
              BUILD_DIR="${GITHUB_WORKSPACE}/build_${ABI}_${BUILD_TYPE}"
              cmake -S "${GITHUB_WORKSPACE}" -B "${BUILD_DIR}" -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE="${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake" \
                -DANDROID_ABI="${ABI}" -DANDROID_PLATFORM=android-28 \
                -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
                -DMIDRAW_BUILD_SHARED=ON \
                -DMIDRAW_BUILD_STATIC=ON \
                -DMIDRAW_BUILD_BENCHMARK=ON \
                -DMIDRAW_BUILD_OVERLAY=ON \
                -DMIDRAW_BUILD_DEMO=ON
              cmake --build "${BUILD_DIR}"
            done
          done

      - name: Collect artifacts
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          mkdir -p "${GITHUB_WORKSPACE}/dist_debug"
          mkdir -p "${GITHUB_WORKSPACE}/dist/include"
          mkdir -p "${GITHUB_WORKSPACE}/dist_debug/include"
          cp "${GITHUB_WORKSPACE}/include/"*.h "${GITHUB_WORKSPACE}/dist/include/" || true
          cp "${GITHUB_WORKSPACE}/include/"*.h "${GITHUB_WORKSPACE}/dist_debug/include/" || true
          if [[ -f "${GITHUB_WORKSPACE}/user_dock.md" ]]; then
            cp "${GITHUB_WORKSPACE}/user_dock.md" "${GITHUB_WORKSPACE}/dist/user_dock.md"
            cp "${GITHUB_WORKSPACE}/user_dock.md" "${GITHUB_WORKSPACE}/dist_debug/user_dock.md"
          fi
          for ABI in ${ANDROID_ABIS}; do
            OUT_DIR="${GITHUB_WORKSPACE}/dist/${ABI}"
            mkdir -p "${OUT_DIR}"
            BUILD_RELEASE="${GITHUB_WORKSPACE}/build_${ABI}_Release"
            find "${BUILD_RELEASE}" -type f \( -name "libmidraw.so" -o -name "libmidraw.a" -o -name "overlay_engine" -o -name "benchmark" -o -name "draw_demo" \) -exec cp {} "${OUT_DIR}" \;
            mkdir -p "${OUT_DIR}/include"
            cp "${GITHUB_WORKSPACE}/include/"*.h "${OUT_DIR}/include/" || true
            if [[ -f "${GITHUB_WORKSPACE}/user_dock.md" ]]; then
              cp "${GITHUB_WORKSPACE}/user_dock.md" "${OUT_DIR}/user_dock.md"
            fi

            OUT_DEBUG="${GITHUB_WORKSPACE}/dist_debug/${ABI}"
            mkdir -p "${OUT_DEBUG}"
            BUILD_DEBUG="${GITHUB_WORKSPACE}/build_${ABI}_Debug"
            find "${BUILD_DEBUG}" -type f \( -name "libmidraw.so" -o -name "libmidraw.a" -o -name "overlay_engine" -o -name "benchmark" -o -name "draw_demo" \) -exec cp {} "${OUT_DEBUG}" \;
            mkdir -p "${OUT_DEBUG}/include"
            cp "${GITHUB_WORKSPACE}/include/"*.h "${OUT_DEBUG}/include/" || true
            if [[ -f "${GITHUB_WORKSPACE}/user_dock.md" ]]; then
              cp "${GITHUB_WORKSPACE}/user_dock.md" "${OUT_DEBUG}/user_dock.md"
            fi
          done
          cp "${GITHUB_WORKSPACE}/include/generated_symbols.h" "${GITHUB_WORKSPACE}/dist" || true
          echo "Collected files:"
          find "${GITHUB_WORKSPACE}/dist" -maxdepth 2 -type f -print
          find "${GITHUB_WORKSPACE}/dist_debug" -maxdepth 2 -type f -print
          {
            echo "dist listing:";
            find "${GITHUB_WORKSPACE}/dist" -maxdepth 2 -type f -print;
            echo "";
            echo "dist_debug listing:";
            find "${GITHUB_WORKSPACE}/dist_debug" -maxdepth 2 -type f -print;
            echo;
            echo "file info:";
            find "${GITHUB_WORKSPACE}/dist" -maxdepth 2 -type f -exec file {} \; || true;
            find "${GITHUB_WORKSPACE}/dist_debug" -maxdepth 2 -type f -exec file {} \; || true;
          } | tee "${GITHUB_WORKSPACE}/dist/manifest.txt"
          cat "${GITHUB_WORKSPACE}/dist/manifest.txt" >> "${GITHUB_STEP_SUMMARY}" || true

      - name: Run CI tests
        run: |
          python3 "${GITHUB_WORKSPACE}/scripts/ci_test.py" \
            --dist "${GITHUB_WORKSPACE}/dist" \
            --ndk "${ANDROID_NDK_HOME}" \
            --repo "${GITHUB_WORKSPACE}" \
            --lib-root "${GITHUB_WORKSPACE}/android-lib-dump"

      - name: Verify artifacts
        run: |
          for ABI in ${ANDROID_ABIS}; do
            for f in libmidraw.so libmidraw.a overlay_engine benchmark draw_demo; do
              if [[ ! -s "${GITHUB_WORKSPACE}/dist/${ABI}/${f}" ]]; then
                echo "Missing or empty artifact: ${ABI}/${f}" >&2
                exit 1
              fi
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            dist/**
            dist_debug/**

  android16-root-test:
    needs: android-build
    runs-on: [self-hosted, android16, root]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: dist

      - name: Run Android 16 root demo
        env:
          REQUIRED_SDK: "36"
        run: |
          chmod +x "${GITHUB_WORKSPACE}/scripts/android16_root_demo.sh"
          "${GITHUB_WORKSPACE}/scripts/android16_root_demo.sh"

      - name: Upload demo logs
        uses: actions/upload-artifact@v4
        with:
          name: android16-root-logs
          path: |
            android16_root_artifacts/**
